; Session cookie hardening for this directory.
;
; The hosting default leaves the session cookie without Secure, without SameSite
; and without strict session id mode (OMZ-05).
;
; These values are ALSO set in src/Http/Session.php and the two must stay identical
; — ADR-0004 treats any difference as a defect. Both are needed: .user.ini is only
; read under FPM/FastCGI, which is production, while development runs mod_php and
; ignores this file entirely.

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1

; Production has no readable error stream (OMZ-04); the application logs its own.
display_errors = 0
